<div class="relative backdrop-blur-sm mx-4 md:mx-6 shrink-0">
  <div class="bg-neutral-800 bg-opacity-20 rounded-lg lg:flex p-3">
    <div class="relative lg:w-3/4 w-full h-40 lg:h-52 overflow-hidden">
      <img class="rounded-md object-cover"
           ngSrc="https://picsum.photos/400/200"
           fill
           alt="{{project.name}}">
    </div>
    <div class="m-4">
      <p class="absolute left-5 top-32 lg:static text-2xl font-medium text-white">{{ project.name }}</p>
      <p class="text-emerald-100">{{ project.description }}</p>
    </div>
  </div>
</div>
